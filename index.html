<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RDAC landing page with artwork, branding, and clickable buttons." />
  <title>RDAC</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --bg: #0b0b0b;
      --frame: rgba(255,255,255,0.1);
      --glow: rgba(255,255,255,0.08);
      --shadow: 0 20px 60px rgba(0,0,0,0.45);
      --radius: clamp(1rem, 2vw, 2rem);
      --space: clamp(0.75rem, 2vw, 1.5rem);
      --max-width: min(94vw, 1440px);
      --text: #f2f2f2;
      --muted: rgba(255,255,255,0.72);
      --btn-bg: rgba(255,255,255,0.07);
      --btn-border: rgba(255,255,255,0.18);
      --btn-hover: rgba(255,255,255,0.13);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space);
      background:
        radial-gradient(circle at top, var(--glow), transparent 28%),
        linear-gradient(180deg, #050505 0%, var(--bg) 100%);
      overflow-x: hidden;
      font-family: "Inter", Arial, sans-serif;
      color: var(--text);
    }

    main {
      width: 100%;
      display: grid;
      place-items: center;
    }

    .page {
      width: min(100%, 1440px);
      display: grid;
      gap: 1rem;
      justify-items: center;
    }

    .image-shell {
      width: var(--max-width);
      border: 1px solid var(--frame);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #111;
      position: relative;
      line-height: 0;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      aspect-ratio: 16 / 9;
      pointer-events: none;
      user-select: none;
    }

    .buttons {
      width: min(var(--max-width), 100%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem;
      padding: 0 0.25rem;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text);
      text-decoration: none;
      padding: 0.95rem 1.25rem;
      border-radius: 999px;
      font-size: clamp(0.9rem, 1vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      min-width: 9rem;
      text-align: center;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-1px);
      background: var(--btn-hover);
      border-color: rgba(255,255,255,0.32);
      outline: none;
    }

    @media (max-width: 640px) {
      :root {
        --max-width: 100%;
      }

      .buttons {
        gap: 0.6rem;
      }

      .btn {
        min-width: 8rem;
        padding: 0.85rem 1rem;
        font-size: 0.88rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="page">
      <figure class="image-shell">
        <img
          src="./rdac-cover.jpg"
          alt="RDAC cover artwork with silver lettering and a spade symbol on a black background."
          width="1600"
          height="900"
          loading="eager"
          decoding="async"
        />
      </figure>

      <nav class="buttons" aria-label="Primary links">
        <a class="btn" href="https://example.com/full-volume" target="_blank" rel="noopener noreferrer">Full Volume</a>
        <a class="btn" href="https://example.com/v29-music" target="_blank" rel="noopener noreferrer">V29 Music</a>
        <a class="btn" href="https://example.com/amplivibe" target="_blank" rel="noopener noreferrer">AmpliVibe</a>
      </nav>
    </div>
  </main>
</body>
</html>
